name: Build
on:
  pull_request:
  push:
    branches: [master, main, dev, develop]
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Build + package the score add-on (dev / SDK / JIT / release tracks).
  # Restricted to linux/x86_64 + windows/x86_64: the StreamDiffusion object loads
  # the librediffusion runtime (CUDA / TensorRT) at run time, so it is only useful
  # on Nvidia desktops. macOS has no Nvidia path in any configuration, so it is
  # excluded here (and via the CMake macOS early-return).
  score:
    uses: ossia/actions/.github/workflows/score-addon.yml@master
    secrets: inherit
    with:
      targets: "linux/x86_64 windows/x86_64"

  # Standalone back-end artifacts for the same two Nvidia-desktop targets. The
  # object now builds standalone (no Qt, no score parser, runtime dynamic-load),
  # so ship the texture-appropriate back-ends. avnd-addon.yml filters each
  # back-end's matrix by `targets`, dropping macOS (no Nvidia path) -- so e.g.
  # gstreamer lands on linux, touchdesigner/max on windows, godot/python on both.
  standalone:
    uses: ossia/actions/.github/workflows/avnd-addon.yml@master
    secrets: inherit
    with:
      targets: "linux/x86_64 windows/x86_64"
      max: true
      godot: true
      touchdesigner: true
      gstreamer: true
      python: true
