name: Build
on:
  pull_request:
  push:
    branches: [master, main, dev, develop]
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Build + package the score add-on (dev / SDK / JIT / release tracks).
  score:
    uses: ossia/actions/.github/workflows/score-addon.yml@master
    secrets: inherit

  # No standalone job: the StreamDiffusion object is score-only. It links
  # CUDA + TensorRT (desktop-only) and is coupled to the ossia score stack --
  # QImage/QByteArray members, score's State::parseValue, and ctre/rapidhash/
  # libossia headers the pure-Avendish back-ends don't ship. CMake registers
  # the object only against score, so a standalone configure would build nothing
  # and the avnd-addon packaging step would have no artifact to publish.
